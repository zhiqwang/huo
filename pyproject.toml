[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huo"
version = "0.1.0a0"
description = "CT Algebraic Reconstruction Technique (ART) with PyTorch"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Zhiqiang Wang", email = "zhiqwang@outlook.com" },
]
keywords = ["scientific-computing", "computed-tomography", "image-reconstruction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.18.5",
    "torch==2.15.0+cpu",
]

[dependency-groups]
test = ["pytest>=8,<10"]
docs = [
    "sphinx==7.2.6",
    "myst-parser>=4,<5",
    "sphinx-autobuild>=2024,<2026",
    "pytorch-sphinx-theme2",
    "jieba==0.42.1",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
pytorch-sphinx-theme2 = { git = "https://github.com/pytorch/pytorch_sphinx_theme.git", rev = "7252b2bb574a0dd534e7c18bfb41e04182f5d1f6" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
huo-art = "huo.cli:main"

[project.urls]
Homepage = "https://github.com/zhiqwang/huo"
"Bug Reports" = "https://github.com/zhiqwang/huo/issues"
Source = "https://github.com/zhiqwang/huo/"

[tool.hatch.build.targets.wheel]
packages = ["huo"]

[tool.usort]
first_party_detection = false

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.flake8]
max-line-length = 110
ignore = "E203, E402, W503, W504, F821"
per-file-ignores = "__init__.py: F401, F403, F405"
exclude = "venv"

[tool.pydocstyle]
select = ["D417"]
