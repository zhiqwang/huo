site_name: Huo 文档
site_description: 扇束 CT 正向投影、迭代重建与数学证明
site_url: https://zhiqwang.github.io/huo/
repo_url: https://github.com/zhiqwang/huo
repo_name: zhiqwang/huo
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 使用教程 (English): tutorial.md
  - 反向投影的数学证明: backward_propagation_proof.md
  - 文档维护与发布: publishing.md

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js

extra_css:
  - stylesheets/extra.css

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
