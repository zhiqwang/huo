<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Browser Demo — Huo</title>
    <link rel="stylesheet" href="./static/demo.css" />
  </head>
  <body class="huo-demo-page">
    <main>
      <h1>Interactive Browser Demo</h1>
      <p>
        Watch a phantom image become a sinogram, then reconstruct it with ART.
        Select <strong>Start</strong> to run both stages in your browser.
      </p>
<!-- demo-content:start -->
<div class="huo-demo" aria-label="CT forward projection and reconstruction">
  <div class="huo-demo-controls">
    <div class="huo-demo-run">
      <button id="startBtn" type="button" disabled>Start</button>
      <div class="huo-demo-progress">
        <progress id="progress" value="0" max="100" aria-label="Reconstruction progress"></progress>
        <span id="status" role="status">Loading…</span>
      </div>
    </div>
    <div class="huo-demo-delay">
      <label for="delaySlider">Frame delay</label>
      <input id="delaySlider" type="range" min="0" max="200" value="20" step="5" aria-describedby="delayValue" />
      <output id="delayValue" for="delaySlider">20 ms</output>
    </div>
  </div>
  <div class="huo-demo-panels">
    <figure class="huo-demo-panel">
      <figcaption><strong>Original phantom</strong><span>Input image · 128 × 128 pixels</span></figcaption>
      <div class="huo-demo-canvas">
        <canvas id="phantom" width="128" height="128" role="img" aria-label="Original phantom image"></canvas>
      </div>
    </figure>
    <figure class="huo-demo-panel">
      <figcaption><strong>Sinogram</strong><span>Rows: angles · Columns: detector</span></figcaption>
      <div class="huo-demo-canvas">
        <canvas id="sinogram" width="200" height="180" role="img" aria-label="Sinogram from forward projection"></canvas>
      </div>
    </figure>
    <figure class="huo-demo-panel">
      <figcaption><strong>ART reconstruction</strong><span>Image recovered from projections</span></figcaption>
      <div class="huo-demo-canvas">
        <canvas id="reconstruction" width="128" height="128" role="img" aria-label="Image reconstructed using ART"></canvas>
      </div>
    </figure>
  </div>
  <noscript>Enable JavaScript to run the interactive reconstruction.</noscript>
</div>

<script type="importmap">
  {
    "imports": {
      "@jax-js/jax": "https://esm.sh/@jax-js/jax@0.1.27"
    }
  }
</script>
<script type="module" src="./main.js"></script>
<!-- demo-content:end -->
      <p>
        <a href="https://zhiqwang.github.io/huo/demo/">Open the demo in the Huo documentation</a>
        · Powered by <a href="https://github.com/ekzhang/jax-js">jax-js</a>
      </p>
    </main>
  </body>
</html>
