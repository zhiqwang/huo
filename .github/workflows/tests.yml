name: Test operators and gradients

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - name: Install Python test dependencies
        run: uv sync --locked --group test
      - name: Build and test TypeScript operators
        working-directory: packages
        run: |
          npm ci
          npm test
      - name: Check operators, transforms, and cross-language parity
        run: uv run --locked --group test pytest tests -q
